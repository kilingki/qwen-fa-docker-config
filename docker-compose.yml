services:
  fa-api:
    build:
      context: ./fa-api
    ports:
      - "${FA_API_PORT:-8090}:8090"
    volumes:
      - ${MODEL_HOST_DIR:-../models/stt/hf}:/models:ro
    environment:
      FA_MODEL_PATH: ${FA_MODEL_PATH:-/models/Qwen3-ForcedAligner-0.6B}
      FA_DTYPE: ${FA_DTYPE:-bfloat16}
      FA_BATCH_SIZE: ${FA_BATCH_SIZE:-4}
      FA_MAX_CHUNK_SECONDS: ${FA_MAX_CHUNK_SECONDS:-180}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: "4gb"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${FA_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4); body=json.load(r); raise SystemExit(0 if r.status==200 and body.get('model_loaded') is True else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
